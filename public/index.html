<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>E-Ink Generator</title>
  <meta name="theme-color" content="#11151c" />
  <!-- use-credentials: behind a login in front of the app, the manifest request must carry its cookie. -->
  <link rel="manifest" id="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
  <link rel="icon" id="icon" type="image/png" href="/icon-192.png" />
  <style>
    :root { color-scheme: light dark; --bg: #f6f7f9; --fg: #1d2330; --muted: #667085; --card: #fff; --line: #d0d5dd; --accent: #2563eb; }
    @media (prefers-color-scheme: dark) { :root { --bg: #11151c; --fg: #e6e9ef; --muted: #98a2b3; --card: #1a202a; --line: #344054; --accent: #5b8def; } }
    body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
    main { max-width: 40rem; margin: 3rem auto; padding: 0 16px; }
    .card { background: var(--card); border-radius: 12px; padding: 1.25rem 1.5rem; }
    .muted { color: var(--muted); }
    h1 { margin: 0; }
    a { color: var(--accent); }
    label { display: block; margin-top: 1rem; }
    textarea, select { box-sizing: border-box; width: 100%; margin-top: 0.25rem; padding: 0.5rem; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
    textarea { min-height: 6rem; resize: vertical; }
    p.own { margin: 1.25rem 0 0; }
    .row.own { margin-top: 0.5rem; }
    label.button { display: inline-block; margin-top: 0; }
    label.button:focus-within { outline: 2px solid var(--fg); outline-offset: 2px; }
    /* The label is the button; the input stays focusable but out of sight. */
    input[type="file"] { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
    label.check { display: flex; gap: 0.5rem; align-items: center; }
    .row { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; margin-top: 1rem; }
    button, a.button, label.button { font: inherit; padding: 0.5rem 1rem; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; text-decoration: none; }
    button:disabled { opacity: 0.5; cursor: default; }
    a.button[hidden] { display: none; }
    /* 240 real pixels, shown at 2x so the dither is visible. */
    canvas { display: block; margin-top: 1rem; width: 480px; max-width: 100%; aspect-ratio: 1; image-rendering: pixelated; border: 1px solid var(--line); background: #fff; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>E-Ink Generator</h1>
      <p class="muted"><span id="info">loading…</span> · <a id="history" href="/history.html">History</a></p>

      <label>Prompt
        <textarea id="prompt" placeholder="a red fox sitting under a yellow moon"></textarea>
      </label>
      <label>Image model
        <select id="model"></select>
      </label>
      <label>Panel palette
        <select id="palette"></select>
      </label>
      <label>Style
        <select id="style"></select>
      </label>
      <label class="check"><input type="checkbox" id="dither" checked /> Dither (Floyd–Steinberg)</label>

      <div class="row">
        <button id="go">Generate</button>
        <a class="button" id="download" download="eink-240x240.png" hidden>Download PNG</a>
        <button id="send" hidden>Send</button>
        <span class="muted" id="status"></span>
      </div>

      <p class="muted own">Or convert your own image — on a computer you can also paste one with Ctrl+V</p>
      <div class="row own">
        <label class="button">Take photo
          <input type="file" id="camera" accept="image/*" capture="environment" />
        </label>
        <label class="button">Choose image
          <input type="file" id="upload" accept="image/*" />
        </label>
      </div>

      <canvas id="out" width="240" height="240"></canvas>
    </div>
  </main>
  <script type="module">
    // Carry the token through, so API calls work when the page was opened with ?token=.
    const token = new URLSearchParams(location.search).get('token');
    const carry = token ? '?token=' + encodeURIComponent(token) : '';
    // Imported here rather than with a static import, so the token rides in its URL.
    const { SIZE, PANEL_INKS, reduce: reduceTo, scale, packFrame, base64 } = await import('/panel.js' + carry);

    const SPECTRA_6 = 'Spectra 6 — black, white, red, yellow, blue, green';
    const PALETTES = {
      [SPECTRA_6]: PANEL_INKS,
      'ACeP 7 — black, white, red, yellow, blue, green, orange': ['black', 'white', 'red', 'yellow', 'blue', 'green', 'orange'],
      '4-color — black, white, red, yellow': ['black', 'white', 'red', 'yellow'],
      '3-color — black, white, red': ['black', 'white', 'red'],
      '3-color — black, white, yellow': ['black', 'white', 'yellow'],
    };

    // What goes in front of the shared panel rules; [SUBJECT] is the text typed.
    // There is deliberately no way to send the text bare: without the panel
    // rules the result does not survive 240x240 and six inks.
    const STYLES = {
      'Flat graphic': 'Create a square image of [SUBJECT] in a clean flat graphic style, with one clear main subject, large and centered.',
      'Bob Ross landscape': 'Create a simple landscape scene of [SUBJECT] in a Bob Ross–inspired style, with happy little trees, layered mountains, soft nature composition, and a peaceful outdoor feeling. Use large simplified shapes and a calm scenic layout.',
      'Anime': 'Create an image of [SUBJECT] in a simple anime-inspired style with bold outlines, expressive features, stylized hair, and clean graphic shapes. Keep the design cute, readable, and uncluttered, with one clear central subject.',
      'Pixel art': 'Create a pixel-art style image of [SUBJECT] with a retro video game feel. Use blocky forms, simplified geometry, and a clear iconic silhouette. Keep the subject large and centered with a minimal background.',
      'Cartoon mascot': 'Create a cartoon mascot illustration of [SUBJECT] with a friendly, playful personality. Use rounded forms, bold outlines, and simple facial features. Make the subject large, centered, and instantly recognizable.',
      'Japanese poster': 'Create an image of [SUBJECT] in a simplified Japanese poster-inspired style, using elegant composition, bold silhouettes, stylized natural elements, and balanced negative space. Keep the design minimal and striking.',
      'Vintage travel poster': 'Create a vintage travel poster–inspired image of [SUBJECT] with bold graphic shapes, simplified scenery, and a strong poster-like composition. Avoid small details and keep the scene clean and eye-catching.',
      'Children’s book': 'Create a children’s book–inspired illustration of [SUBJECT] with simple charming shapes, a warm playful mood, and a clean storybook composition. Keep the image friendly, uncluttered, and easy to read at small size.',
      'Minimal icon': 'Create a minimal icon-style image of [SUBJECT] using very large simple shapes, a strong silhouette, and an ultra-clean composition. Keep the background minimal and emphasize clarity over detail.',
      'Comic book': 'Create a comic book–inspired image of [SUBJECT] with bold outlines, dramatic simplified shapes, and strong visual contrast. Keep the composition dynamic but uncluttered, with one clear focal subject.',
      'Sticker / vinyl decal': 'Create a sticker-style illustration of [SUBJECT] with thick outlines, flat color areas, simplified shapes, and a clean cutout look. Keep the subject large and centered with little or no background detail.',
    };

    const $ = (id) => document.getElementById(id);
    const canvas = $('out');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    // The undithered 240x240 pixels, kept so palette and dither changes do not cost another API call.
    let source = null;
    // The name the server stored that generation under, or null if it stored nothing.
    let savedName = null;
    // What OpenAI reported for the generation on screen, as text for the status line.
    let usageNote = '';
    // The partner whose display Send goes to, from /api/info; null when there is none.
    let partner = null;

    for (const label of Object.keys(PALETTES)) $('palette').add(new Option(label, label));
    for (const label of Object.keys(STYLES)) $('style').add(new Option(label, label));
    // Start on the last style picked in this browser.
    try {
      const remembered = localStorage.getItem('style');
      if (STYLES[remembered]) $('style').value = remembered;
    } catch {}

    const headers = { 'content-type': 'application/json', ...(token ? { 'x-token': token } : {}) };
    // The browser fetches these two itself, so the token has to ride in their URLs.
    if (token) for (const id of ['manifest', 'icon', 'history']) $(id).href += carry;

    // Behind Cloudflare Access an expired session turns API calls into a
    // redirect to the login page, which fetch must not follow. Reload instead,
    // so the browser goes through the login and comes back. At most once a
    // minute, so a login that keeps failing shows an error instead of looping.
    // The app itself always answers JSON; a 401 or 403 that is not JSON is Access.
    async function api(url, init) {
      const res = await fetch(url, { ...init, redirect: 'manual' });
      const fromAccess = (res.status === 401 || res.status === 403) && !(res.headers.get('content-type') || '').includes('json');
      if (res.type !== 'opaqueredirect' && !fromAccess) return res;
      let last = 0;
      try { last = Number(sessionStorage.getItem('relogin')) || 0; } catch {}
      if (Date.now() - last > 60_000) {
        try { sessionStorage.setItem('relogin', String(Date.now())); } catch {}
        location.reload();
        return new Promise(() => {});
      }
      throw new Error('signed out: reload the page to sign in again');
    }

    function inks() {
      return PALETTES[$('palette').value];
    }

    // What is on screen reduced to the given inks.
    function reduce(names, dither) {
      return reduceTo(source, names, dither);
    }

    function render() {
      if (!source) return;
      ctx.putImageData(reduce(inks(), $('dither').checked), 0, 0);
      $('send').hidden = !partner;
      canvas.toBlob((blob) => {
        const link = $('download');
        if (link.href) URL.revokeObjectURL(link.href);
        link.href = URL.createObjectURL(blob);
        link.hidden = false;
      }, 'image/png');
      storeDithered();
    }

    // Keeps the stored 240x240 copy in step with what is on screen: a palette
    // or dither change overwrites it.
    function storeDithered() {
      if (!savedName) return;
      const name = savedName;
      const image = canvas.toDataURL('image/png').split(',')[1];
      api('/api/dithered', { method: 'POST', headers, body: JSON.stringify({ name, image }) })
        .then((r) => r.json())
        .then((d) => {
          if (d.error) throw new Error(d.error);
          if (name === savedName) $('status').textContent = [`saved as ${d.saved}`, usageNote].filter(Boolean).join(' · ');
        })
        .catch((e) => { $('status').textContent = `${SIZE}x${SIZE} copy not saved: ${e.message}`; });
    }

    // Always packed from Spectra 6, whatever the palette picklist shows: a frame
    // from any other palette would come out wrong on the panel. The dither
    // setting is kept.
    async function sendToPartner() {
      if (!source || !partner) return;
      const name = savedName;
      const image = reduce(PALETTES[SPECTRA_6], $('dither').checked);
      const body = { frame: base64(packFrame(image)) };
      if (name) {
        body.name = name;
      } else {
        // Converted in the browser, so the server needs the picture too.
        const scratch = document.createElement('canvas');
        scratch.width = scratch.height = SIZE;
        scratch.getContext('2d').putImageData(image, 0, 0);
        body.image = scratch.toDataURL('image/png').split(',')[1];
      }
      $('send').disabled = true;
      $('status').textContent = `sending to ${partner.name}…`;
      try {
        const res = await api('/api/send', { method: 'POST', headers, body: JSON.stringify(body) });
        const d = await res.json();
        if (d.error) throw new Error(d.error);
        $('status').textContent = `sent to ${d.to}'s display`;
      } catch (e) {
        $('status').textContent = `not sent: ${e.message}`;
      } finally {
        $('send').disabled = false;
      }
    }

    function load(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error('could not decode the image'));
        img.src = src;
      });
    }

    // Scales an image onto the panel's pixels and renders it.
    function show(img, name) {
      source = scale(ctx, img);
      savedName = name;
      render();
    }

    function describeUsage(usage) {
      if (!usage || typeof usage.total_tokens !== 'number') return '';
      const count = (n) => Number(n || 0).toLocaleString();
      return `${count(usage.total_tokens)} tokens (${count(usage.input_tokens)} in, ${count(usage.output_tokens)} out)`;
    }

    async function convert(file) {
      if (!file) return;
      usageNote = '';
      const url = URL.createObjectURL(file);
      try {
        show(await load(url), null);
        $('status').textContent = 'converted in the browser, not stored on the server';
      } catch (e) {
        $('status').textContent = e.message;
      } finally {
        URL.revokeObjectURL(url);
      }
    }

    async function generate() {
      let prompt = $('prompt').value.trim();
      if (!prompt) { $('status').textContent = 'write a prompt first'; return; }
      const typed = prompt;
      const style = STYLES[$('style').value] ? $('style').value : Object.keys(STYLES)[0];
      const subject = prompt.replace(/[.!\s]+$/, '');
      const colors = inks().join(', ').replace(/, ([^,]+)$/, ', and $1');
      // Every style ends with the same rules for the panel.
      prompt = `${STYLES[style].replace('[SUBJECT]', () => subject)}\n\nOptimized for a ${SIZE}x${SIZE} pixel color e-ink display. Use only ${colors}. Flat solid fills, bold simple shapes, thick outlines, high contrast, no gradients, no shadows, no textures, no fine detail, no text. Keep one main subject large and clear, with a simple uncluttered background and strong negative space. The image must remain recognizable after downscaling to ${SIZE}x${SIZE}.`;
      $('go').disabled = true;
      $('status').textContent = 'generating… this can take a minute';
      try {
        const res = await api('/api/generate', { method: 'POST', headers, body: JSON.stringify({ prompt, subject: typed, style, model: $('model').value || undefined }) });
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        const img = await load('data:image/png;base64,' + data.image);
        usageNote = describeUsage(data.usage);
        $('status').textContent = usageNote;
        show(img, data.saved);
      } catch (e) {
        $('status').textContent = e.message;
      } finally {
        $('go').disabled = false;
      }
    }

    $('go').addEventListener('click', generate);
    $('send').addEventListener('click', sendToPartner);
    for (const id of ['camera', 'upload']) {
      $(id).addEventListener('change', () => {
        convert($(id).files[0]);
        // Cleared so that choosing the same picture again still fires a change.
        $(id).value = '';
      });
    }
    // Ctrl+V anywhere on the page. Pasted text is left alone so the prompt box still works.
    document.addEventListener('paste', (event) => {
      const file = [...event.clipboardData.files].find((f) => f.type.startsWith('image/'));
      if (!file) return;
      event.preventDefault();
      convert(file);
    });
    $('model').addEventListener('change', () => {
      try { localStorage.setItem('model', $('model').value); } catch {}
    });
    $('style').addEventListener('change', () => {
      try { localStorage.setItem('style', $('style').value); } catch {}
    });
    $('palette').addEventListener('change', render);
    $('dither').addEventListener('change', render);

    api('/api/info', { headers })
      .then((r) => r.json())
      .then((d) => {
        if (d.error) throw new Error(d.error);
        partner = d.partner;
        if (partner) $('send').textContent = `Send to ${partner.name}`;
        $('send').hidden = !(partner && source);
        $('info').textContent = d.ready ? `${SIZE}×${SIZE} colored e-ink images` : 'OPENAI_API_KEY is not set on the server';
        for (const model of d.models) $('model').add(new Option(model, model));
        // Start on the last model picked in this browser, else the server's default.
        let remembered = null;
        try { remembered = localStorage.getItem('model'); } catch {}
        $('model').value = d.models.includes(remembered) ? remembered : d.model;
      })
      .catch((e) => { $('info').textContent = e.message; });
  </script>
</body>
</html>
