<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>History — E-Ink Generator</title>
  <meta name="theme-color" content="#11151c" />
  <link rel="icon" id="icon" type="image/png" href="/icon-192.png" />
  <style>
    :root { color-scheme: light dark; --bg: #f6f7f9; --fg: #1d2330; --muted: #667085; --card: #fff; --line: #d0d5dd; --accent: #2563eb; }
    @media (prefers-color-scheme: dark) { :root { --bg: #11151c; --fg: #e6e9ef; --muted: #98a2b3; --card: #1a202a; --line: #344054; --accent: #5b8def; } }
    body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
    main { max-width: 64rem; margin: 3rem auto; padding: 0 16px; }
    h1 { margin: 0; }
    a { color: var(--accent); }
    .muted { color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: 1rem; margin-top: 1.5rem; }
    .card { background: var(--card); border-radius: 12px; padding: 0.75rem; overflow-wrap: anywhere; }
    /* 240 real pixels; kept crisp when the card is wider. */
    .card img { display: block; width: 100%; aspect-ratio: 1; image-rendering: pixelated; border: 1px solid var(--line); border-radius: 6px; background: #fff; box-sizing: border-box; }
    .card h2 { font-size: 1rem; margin: 0.5rem 0 0; }
    .card p { margin: 0.15rem 0 0; font-size: 0.875rem; }
    details { margin-top: 0.35rem; font-size: 0.8125rem; }
    summary { cursor: pointer; color: var(--muted); }
    details p { white-space: pre-wrap; }
    .actions { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.5rem; font-size: 0.875rem; }
    button { font: inherit; padding: 0.35rem 0.8rem; border-radius: 8px; border: 1px solid var(--line); background: var(--accent); color: #fff; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: default; }
    button.delete { background: transparent; color: var(--fg); }
  </style>
</head>
<body>
  <main>
    <h1>History</h1>
    <p class="muted"><a id="back" href="/">← Generator</a> · <span id="info">loading…</span></p>
    <div class="grid" id="grid"></div>
  </main>
  <script type="module">
    const $ = (id) => document.getElementById(id);
    // Carry the token through, so API calls, images and links work when the page was opened with ?token=.
    const token = new URLSearchParams(location.search).get('token');
    const carry = token ? '?token=' + encodeURIComponent(token) : '';
    // Imported here rather than with a static import, so the token rides in its URL.
    const { SIZE, PANEL_INKS, reduce, scale, packFrame, base64 } = await import('/panel.js' + carry);
    // The partner whose display Send goes to, from /api/info; null when there is none.
    let partner = null;
    $('back').href += carry;
    $('icon').href += carry;

    // Behind Cloudflare Access an expired session turns API calls into a
    // redirect to the login page, which fetch must not follow. Reload instead,
    // so the browser goes through the login and comes back. At most once a
    // minute, so a login that keeps failing shows an error instead of looping.
    // The app itself always answers JSON; a 401 or 403 that is not JSON is Access.
    async function api(url, init) {
      const res = await fetch(url, { ...init, redirect: 'manual' });
      const fromAccess = (res.status === 401 || res.status === 403) && !(res.headers.get('content-type') || '').includes('json');
      if (res.type !== 'opaqueredirect' && !fromAccess) return res;
      let last = 0;
      try { last = Number(sessionStorage.getItem('relogin')) || 0; } catch {}
      if (Date.now() - last > 60_000) {
        try { sessionStorage.setItem('relogin', String(Date.now())); } catch {}
        location.reload();
        return new Promise(() => {});
      }
      throw new Error('signed out: reload the page to sign in again');
    }

    function element(tag, text, className) {
      const node = document.createElement(tag);
      if (text) node.textContent = text;
      if (className) node.className = className;
      return node;
    }

    function load(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error('could not load the image'));
        img.src = src;
      });
    }

    // Packed again from the 1024x1024 original, reduced to Spectra 6 and
    // dithered as the generator does by default: the stored 240x240 copy may
    // show another palette, which would come out wrong on the panel.
    async function sendToPartner(g, button, status) {
      button.disabled = true;
      status.textContent = `sending to ${partner.name}…`;
      try {
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = SIZE;
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const source = scale(ctx, await load(`/api/images/${g.name}.png${carry}`));
        const frame = base64(packFrame(reduce(source, PANEL_INKS, true)));
        const res = await api('/api/send' + carry, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ frame, name: g.name }),
        });
        const d = await res.json();
        if (d.error) throw new Error(d.error);
        status.textContent = `sent to ${d.to}'s display`;
      } catch (e) {
        status.textContent = `not sent: ${e.message}`;
      } finally {
        button.disabled = false;
      }
    }

    // Asks first: the original, the 240x240 copy and the record go for good.
    // A frame a display is still showing stays on the server until replaced.
    async function deleteGeneration(g, node, buttons, status) {
      if (!confirm(`Delete "${g.subject || g.name}"? This cannot be undone.`)) return;
      for (const b of buttons) b.disabled = true;
      status.textContent = 'deleting…';
      try {
        const res = await api('/api/delete' + carry, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ name: g.name }),
        });
        const d = await res.json();
        if (d.error) throw new Error(d.error);
        node.remove();
      } catch (e) {
        status.textContent = `not deleted: ${e.message}`;
        for (const b of buttons) b.disabled = false;
      }
    }

    function card(g) {
      const node = element('div', '', 'card');
      const original = `/api/images/${g.name}.png${carry}`;

      // The 240x240 copy is what the panel shows; an old generation may only have its original.
      const link = element('a');
      link.href = original;
      link.target = '_blank';
      link.title = 'Open the 1024x1024 original';
      const img = element('img');
      img.loading = 'lazy';
      img.alt = g.subject || 'generated image';
      img.src = g.dithered ? `/api/images/${g.name}-240.png${carry}` : original;
      link.append(img);
      node.append(link);

      node.append(element('h2', g.subject || '(no subject recorded)'));
      node.append(element('p', [g.style, g.model].filter(Boolean).join(' · '), 'muted'));
      const when = g.created ? new Date(g.created).toLocaleString() : '';
      const tokens = g.usage && typeof g.usage.total_tokens === 'number' ? `${g.usage.total_tokens.toLocaleString()} tokens` : '';
      node.append(element('p', [when, tokens].filter(Boolean).join(' · '), 'muted'));

      if (g.prompt) {
        const details = element('details');
        details.append(element('summary', 'Prompt sent'), element('p', g.prompt));
        node.append(details);
      }

      const row = element('div', '', 'actions');
      const status = element('span', '', 'muted');
      const buttons = [];
      if (partner) {
        const send = element('button', `Send to ${partner.name}`);
        send.addEventListener('click', () => sendToPartner(g, send, status));
        buttons.push(send);
      }
      const remove = element('button', 'Delete', 'delete');
      remove.addEventListener('click', () => deleteGeneration(g, node, buttons, status));
      buttons.push(remove);
      row.append(...buttons, status);
      node.append(row);
      return node;
    }

    // Without a partner the page still lists the history, just with no Send button.
    api('/api/info' + carry)
      .then((r) => r.json())
      .then((d) => { partner = d.partner || null; })
      .catch(() => {})
      .then(() => api('/api/generations' + carry))
      .then((r) => r.json())
      .then((d) => {
        if (d.error) throw new Error(d.error);
        $('info').textContent = d.generations.length ? `last ${d.generations.length} generations, newest first` : 'nothing generated yet';
        $('grid').append(...d.generations.map(card));
      })
      .catch((e) => { $('info').textContent = e.message; });
  </script>
</body>
</html>
